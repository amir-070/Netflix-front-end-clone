<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="sign.css" />
    <link rel="icon" href="" />
  </head>

  <body>
    <div class="bg-img">
      <form>
        <div class="bg-color">
          <div class="mainf">
            <div class="mdiv">
              <div class="hed"><h1>Sign In</h1></div>
              <input placeholder="Email or Mobile number" required />
              <input type="password" placeholder="Password" required />
              <button class="btc">Sign in</button>
              <p>OR</p>
              <button>Use a sign-in code</button>
              <a href="#">Forget password?</a>
            </div>
            <div class="bottom">
              <input type="checkbox" class="check" value="Remember me" />
              <p class="rememberme">Remember me</p>
              <p class="forgetpass">
                New to Netflix?<a href="#">Sign up now.</a>
              </p>
              <p class="forgetpass col">
                This page is protected by Google reCAPTCHA to ensure you're not
                a bot.
              </p>
            </div>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
